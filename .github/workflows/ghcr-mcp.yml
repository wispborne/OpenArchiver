name: ghcr-mcp

# Builds the MCP server's image and publishes it to GitHub Container Registry when the server (or
# the shared types it is built against) changes on main.
# Tags: the first 12 characters of the commit SHA, `main` and `latest`, as ghcr.yml does for the app.
# A fork-only workflow in its own file, so merges from upstream never conflict with it.

on:
    push:
        branches:
            - main
        paths:
            - 'packages/mcp-server/**'
            - 'packages/types/**'
            - 'pnpm-lock.yaml'
            - '.github/workflows/ghcr-mcp.yml'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: ghcr-mcp-${{ github.ref }}
    cancel-in-progress: false

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Image name and tag
              id: meta
              run: |
                  echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-archiver-mcp" >> "$GITHUB_OUTPUT"
                  echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # arm64 as well as amd64: the stdio mode runs on users' own machines, Apple Silicon
            # Macs included, where an amd64-only image would run emulated.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./packages/mcp-server/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
                      ${{ steps.meta.outputs.image }}:main
                      ${{ steps.meta.outputs.image }}:latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.description=Read-only MCP server for Open Archiver
                  cache-from: type=gha,scope=mcp
                  cache-to: type=gha,mode=max,scope=mcp
